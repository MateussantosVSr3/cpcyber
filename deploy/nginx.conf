limit_req_zone $binary_remote_addr zone=sast_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 3.149.250.106;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 3.149.250.106;

    ssl_certificate /etc/letsencrypt/live/3.149.250.106/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.149.250.106/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SAST_TLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req zone=sast_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
    }
}
