x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    expose:
      - "8000"
    environment: &app-env
      DATABASE_URL: postgresql://sast:${POSTGRES_PASSWORD:?Execute python scripts/init_env.py}@postgres:5432/sast
      REDIS_URL: redis://redis:6379/0
      CODEX_BRIDGE_URL: http://codex:8090
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Execute python scripts/init_env.py}
      SAST_USERNAME: ${SAST_USERNAME:?Execute python scripts/init_env.py}
      SAST_PASSWORD_HASH: ${SAST_PASSWORD_HASH:?Execute python scripts/init_env.py}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  worker:
    build: .
    command: ["celery", "-A", "sast.jobs:celery_app", "worker", "--loglevel=info", "--concurrency=${CELERY_CONCURRENCY:-1}"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sast
      POSTGRES_USER: sast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute python scripts/init_env.py}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sast -d sast"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
  codex:
    build:
      context: ./codex-bridge
      args:
        CODEX_VERSION: ${CODEX_VERSION:-latest}
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Execute python scripts/init_env.py}
      CODEX_CA_CERTIFICATE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - codex_auth:/home/node/.codex
      - ./codex-bridge/server.mjs:/app/server.mjs:ro
      - ./codex-bridge/rpc.mjs:/app/rpc.mjs:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  tls-init:
    image: alpine:3.22
    volumes:
      - letsencrypt:/etc/letsencrypt
    command:
      - /bin/sh
      - -c
      - >-
        if [ ! -s /etc/letsencrypt/live/3.149.250.106/fullchain.pem ]; then
          apk add --no-cache openssl &&
          mkdir -p /etc/letsencrypt/live/3.149.250.106 &&
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
          -keyout /etc/letsencrypt/live/3.149.250.106/privkey.pem \
          -out /etc/letsencrypt/live/3.149.250.106/fullchain.pem \
          -subj /CN=3.149.250.106 \
          -addext subjectAltName=IP:3.149.250.106;
        fi
    restart: "no"
    logging: *default-logging
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
      tls-init: { condition: service_completed_successfully }
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
  certbot:
    image: certbot/certbot:v5.4.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    profiles: ["maintenance"]
    logging: *default-logging
volumes:
  postgres_data:
  redis_data:
  codex_auth:
  letsencrypt:
  certbot_webroot:
